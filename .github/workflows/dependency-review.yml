name: dependency-review

# SHA-pinned actions per OWASP A03:2025. Refresh tags with:
# git ls-remote --tags https://github.com/actions/dependency-review-action.git 'refs/tags/v4*'

on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'plugins/**'
      - 'config/**'
      - '.github/workflows/dependency-review.yml'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  dependency-review:
    name: Dependency review
    permissions:
      contents: read
      pull-requests: write
    uses: NDDev-OpenNetwork/ci-workflows/.github/workflows/public-dependency-review.yml@36bea6e4ac643872e9a504b2fe19aad9487e398a # 0.2.0-dev
    with:
      fail_on_severity: moderate
