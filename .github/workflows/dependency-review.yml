name: dependency-review

# SHA-pinned actions per OWASP A03:2025. Refresh tags with:
# git ls-remote --tags https://github.com/actions/dependency-review-action.git 'refs/tags/v4*'

on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'plugins/**'
      - 'config/**'
      - '.github/workflows/dependency-review.yml'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  dependency-review:
    name: Dependency review
    permissions:
      contents: read
      pull-requests: write
    uses: NDDev-it-com/ci-workflows/.github/workflows/public-dependency-review.yml@7f69c724923d06b2c2057c5a6ad341c37f1a8995 # 0.13.3
    with:
      fail_on_severity: moderate
