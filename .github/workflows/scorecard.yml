name: scorecard

on:
  schedule:
    - cron: "0 3 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  analysis:
    name: OSSF Scorecard analysis
    permissions:
      id-token: write
      contents: read
      actions: read
    uses: NDDev-OpenNetwork/ci-workflows/.github/workflows/public-scorecard-json.yml@1eaaa687f32f81c33ac99be3db0b76d0204420b8 # 0.1.8
    with:
      publish_results: false
