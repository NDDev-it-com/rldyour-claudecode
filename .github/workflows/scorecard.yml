name: scorecard

on:
  schedule:
    - cron: "0 3 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  analysis:
    name: OSSF Scorecard analysis
    permissions:
      id-token: write
      contents: read
      actions: read
    uses: NDDev-it-com/ci-workflows/.github/workflows/public-scorecard-json.yml@7f69c724923d06b2c2057c5a6ad341c37f1a8995 # 0.13.3
    with:
      publish_results: false
