name: actionlint

# Lints GitHub Actions workflow YAML for syntax errors, expression typos,
# unused vars, deprecated patterns. Complements CodeQL `actions` language
# coverage with workflow-syntax-specific checks.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: actionlint
    permissions:
      contents: read
    uses: NDDev-it-com/ci-workflows/.github/workflows/actionlint.yml@ac4d1f469f5974741c7449305ffcbd5f05a5a47f # 0.5.1
    with:
      # Public repo: pull_request runs untrusted fork code. Pin the hosted runner
      # explicitly — several ci-workflows reusables now default `runner` to the
      # self-hosted `amsterdam` label, so inheriting the default on a pin bump
      # would put fork PRs on trusted private infrastructure.
      runner: ubuntu-latest
